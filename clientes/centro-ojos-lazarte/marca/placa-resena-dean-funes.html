<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:Manrope,system-ui,sans-serif;background:#fff;color:#1C3044;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:54px 90px;position:relative;overflow:hidden}
.glow{position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(61,139,122,.10),transparent 70%);top:-150px;right:-150px;z-index:0}
.logo{width:450px;height:auto;z-index:1}
.stars{color:#E8A33D;font-size:36px;letter-spacing:6px;z-index:1}
h1{font-size:46px;font-weight:800;line-height:1.05;z-index:1}
.lead{font-size:21px;color:#5b6b78;max-width:24ch;line-height:1.45;font-weight:500;z-index:1}
.qrpanel{background:#fff;border:1px solid #e4e7ea;border-radius:22px;padding:18px 18px 14px;box-shadow:0 22px 52px -30px rgba(28,48,68,.5);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:1}
.qrpanel img{width:196px;height:196px;image-rendering:pixelated;display:block}
.qrpanel .tap{color:#1C3044;font-weight:800;font-size:19px}
.steps{display:flex;gap:24px;z-index:1}
.step{display:flex;flex-direction:column;align-items:center;gap:7px;max-width:150px}
.step .n{width:38px;height:38px;border-radius:50%;background:#1C3044;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.step .t{font-size:15px;color:#33566e;line-height:1.3;font-weight:600}
.chip{margin-top:6px;background:#1C3044;color:#fff;border-radius:999px;padding:14px 30px;display:inline-flex;align-items:center;gap:11px;font-weight:800;font-size:23px;z-index:1;box-shadow:0 14px 30px -16px rgba(28,48,68,.5)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:#E8A33D}
.addr{font-size:16px;color:#5b6b78;font-weight:600;z-index:1;margin-top:-4px}
.gg{font-size:13px;color:#9aa7b0;z-index:1}
</style></head><body>
